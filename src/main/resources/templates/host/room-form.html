<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Phòng')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
    <div class="card form-medium">
        <h2 th:text="${roomId == null} ? 'Thêm phòng' : 'Sửa phòng'">Phòng</h2>

        <form th:object="${form}" method="post" enctype="multipart/form-data"
              th:action="${roomId == null} ? @{/host/homestays/{id}/rooms/new(id=${homestayId})} : @{/host/rooms/{id}/edit(id=${roomId})}">
            <label>Tên phòng
                <input type="text" th:field="*{name}">
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </label>
            <div class="row">
                <label>Giá / đêm (đ)
                    <input type="number" th:field="*{pricePerNight}" step="1000">
                    <span class="field-error" th:if="${#fields.hasErrors('pricePerNight')}" th:errors="*{pricePerNight}"></span>
                </label>
                <label>Sức chứa (người)
                    <input type="number" th:field="*{capacity}" min="1">
                    <span class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></span>
                </label>
            </div>
            <label>Mô tả
                <textarea th:field="*{description}" rows="3"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </label>
            <label>Link ảnh
                <input type="text" th:field="*{imageUrl}" placeholder="https://...">
                <span class="field-error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></span>
            </label>
            <label>Hoặc tải ảnh từ máy (JPG, PNG, GIF, WEBP, tối đa 5MB)
                <input type="file" name="imageFile" accept="image/jpeg,image/png,image/gif,image/webp"
                       onchange="if (this.files[0] && this.files[0].size > 5 * 1024 * 1024) { alert('Ảnh tối đa 5MB'); this.value = ''; }">
                <span class="field-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></span>
            </label>
            <label class="check">
                <input type="checkbox" th:field="*{available}"> Đang nhận khách
            </label>
            <button type="submit" class="btn">Lưu</button>
            <a class="btn btn-outline" th:href="@{/host/homestays/{id}/rooms(id=${homestayId})}">Hủy</a>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
