<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Homestay')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
    <div class="card form-medium">
        <h2 th:text="${homestayId == null} ? 'Thêm homestay' : 'Sửa homestay'">Homestay</h2>

        <form th:object="${form}" method="post" enctype="multipart/form-data"
              th:action="${homestayId == null} ? @{/host/homestays/new} : @{/host/homestays/{id}/edit(id=${homestayId})}">
            <label>Tên homestay
                <input type="text" th:field="*{name}">
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </label>
            <div class="row">
                <label>Thành phố
                    <input type="text" th:field="*{city}" placeholder="Đà Lạt">
                    <span class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
                </label>
                <label>Địa chỉ
                    <input type="text" th:field="*{address}">
                    <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                </label>
            </div>
            <label>Mô tả
                <textarea th:field="*{description}" rows="4"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </label>
            <label>Link ảnh đại diện
                <input type="text" th:field="*{imageUrl}" placeholder="https://...">
                <span class="field-error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></span>
            </label>
            <label>Hoặc tải ảnh đại diện từ máy (JPG, PNG, GIF, WEBP, tối đa 5MB)
                <input type="file" name="imageFile" accept="image/jpeg,image/png,image/gif,image/webp"
                       onchange="if (this.files[0] && this.files[0].size > 5 * 1024 * 1024) { alert('Ảnh tối đa 5MB'); this.value = ''; }">
                <span class="field-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></span>
            </label>
            <label>Tiện ích (phân cách bằng dấu phẩy)
                <input type="text" th:field="*{amenities}" placeholder="Wifi, Bữa sáng, Bể bơi">
                <span class="field-error" th:if="${#fields.hasErrors('amenities')}" th:errors="*{amenities}"></span>
            </label>
            <button type="submit" class="btn">Lưu</button>
            <a class="btn btn-outline" th:href="@{/host}">Hủy</a>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
