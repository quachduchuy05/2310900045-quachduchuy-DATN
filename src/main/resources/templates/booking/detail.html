<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết đơn')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <a class="back-link" th:href="@{/bookings}"><svg class="ic"><use href="#i-back"/></svg>Danh sách đơn</a>

    <h1>Đơn #<span th:text="${booking.id}">1</span>
        <span th:replace="~{fragments/layout :: bookingStatus(${booking.status})}"></span>
    </h1>

    <div class="checkout">
        <div>
            <section class="card">
                <div class="dates">
                    <div><small>Nhận phòng</small><b th:text="${#temporals.format(booking.checkIn, 'dd/MM/yyyy')}"></b></div>
                    <div><small>Trả phòng</small><b th:text="${#temporals.format(booking.checkOut, 'dd/MM/yyyy')}"></b></div>
                </div>
                <dl class="lines">
                    <div><dt>Số đêm</dt><dd th:text="${booking.nights}"></dd></div>
                    <div><dt>Số khách</dt><dd th:text="${booking.guests}"></dd></div>
                    <div th:if="${!#strings.isEmpty(booking.note)}"><dt>Ghi chú</dt><dd th:text="${booking.note}"></dd></div>
                    <div class="grand"><dt>Tổng tiền</dt>
                        <dd class="price total" th:text="${#numbers.formatDecimal(booking.totalPrice, 0, 'POINT', 0, 'COMMA')} + 'đ'">0đ</dd></div>
                </dl>

                <th:block th:if="${booking.status.name() == 'PENDING'}">
                    <div class="alert alert-info">
                        Vui lòng thanh toán trước
                        <b th:text="${#temporals.format(deadline, 'HH:mm dd/MM/yyyy')}">hạn</b>,
                        nếu không đơn sẽ tự hủy và nhả phòng.
                    </div>
                    <form th:action="@{/payment/create/{id}(id=${booking.id})}" method="post">
                        <button type="submit" class="btn btn-ok btn-lg btn-block"><svg class="ic"><use href="#i-card"/></svg>Thanh toán VNPay</button>
                    </form>
                    <form th:action="@{/bookings/{id}/cancel(id=${booking.id})}" method="post" style="margin-top:12px"
                          onsubmit="return confirm('Bạn chắc chắn muốn hủy đơn này?')">
                        <button type="submit" class="btn btn-danger btn-block">Hủy đơn</button>
                    </form>
                </th:block>
            </section>

            <section class="card" th:if="${canReview}">
                <h3 class="card-title"><svg class="ic ic-star"><use href="#i-star"/></svg>Đánh giá chỗ ở</h3>
                <form th:action="@{/bookings/{id}/review(id=${booking.id})}" method="post">
                    <label>Số sao
                        <select name="rating">
                            <option value="5">★★★★★ Tuyệt vời</option>
                            <option value="4">★★★★ Tốt</option>
                            <option value="3">★★★ Bình thường</option>
                            <option value="2">★★ Chưa tốt</option>
                            <option value="1">★ Tệ</option>
                        </select>
                    </label>
                    <label>Nhận xét
                        <textarea name="comment" rows="3" maxlength="1000" placeholder="Chia sẻ trải nghiệm của bạn"></textarea>
                    </label>
                    <button type="submit" class="btn">Gửi đánh giá</button>
                </form>
            </section>
            <section class="card" th:if="${review != null}">
                <h3>Đánh giá của bạn</h3>
                <div class="stars" th:text="${#strings.repeat('★', review.rating) + #strings.repeat('☆', 5 - review.rating)}"></div>
                <p th:text="${review.comment}"></p>
            </section>

            <section th:if="${!#lists.isEmpty(payments)}">
                <h3>Lịch sử thanh toán của đơn</h3>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Mã giao dịch</th><th>Thời gian</th><th>Số tiền</th><th>Trạng thái</th></tr></thead>
                        <tbody>
                        <tr th:each="p : ${payments}">
                            <td th:text="${p.txnRef}"></td>
                            <td th:text="${#temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="price" th:text="${#numbers.formatDecimal(p.amount, 0, 'POINT', 0, 'COMMA')} + 'đ'"></td>
                            <td><span th:replace="~{fragments/layout :: paymentStatus(${p.status})}"></span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <aside class="card">
            <img class="summary-img" th:src="${#strings.isEmpty(booking.room.imageUrl)} ? @{/images/placeholder.svg} : ${booking.room.imageUrl}" th:alt="${booking.room.name}">
            <h3 th:text="${booking.room.homestay.name}">Homestay</h3>
            <p th:text="${booking.room.name}">Phòng</p>
            <p class="muted small"><svg class="ic"><use href="#i-pin"/></svg> <span th:text="${booking.room.homestay.address}">Địa chỉ</span></p>
            <a class="btn btn-outline btn-block" th:href="@{/homestays/{id}(id=${booking.room.homestay.id})}">Xem homestay</a>
        </aside>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
