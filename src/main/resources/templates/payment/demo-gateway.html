<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cổng thanh toán giả lập')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
    <div class="card pay-box">
        <div class="status-icon"><svg class="ic"><use href="#i-bank"/></svg></div>
        <h2>Cổng thanh toán giả lập</h2>
        <div class="alert alert-info">Chế độ DEMO: chưa cấu hình VNPay thật nên hệ thống dùng trang này để mô phỏng.</div>
        <p>Mã giao dịch: <b th:text="${payment.txnRef}">123_456</b></p>
        <div class="pay-amount" th:text="${#numbers.formatDecimal(payment.amount, 0, 'POINT', 0, 'COMMA')} + 'đ'">0đ</div>

        <form th:action="@{/payment/demo-gateway}" method="post">
            <input type="hidden" name="txnRef" th:value="${payment.txnRef}">
            <button type="submit" name="success" value="true" class="btn btn-ok btn-lg btn-block" style="margin-bottom:12px">Thanh toán thành công</button>
            <button type="submit" name="success" value="false" class="btn btn-danger btn-block">Hủy giao dịch</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
