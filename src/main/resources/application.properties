spring.application.name=Staygo
# Khóa bí mật đặt trong file secrets.properties ở thư mục dự án (không đưa lên git)
spring.config.import=optional:file:./secrets.properties
server.port=8080

# ===== MySQL (ghi đè bằng biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/staygo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# ===== Ảnh tải lên =====
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== Đặt phòng: số phút giữ phòng chờ thanh toán =====
booking.pending-expire-minutes=15

# ===== Gemini AI (để YOUR_ để dùng lịch trình dự phòng) =====
gemini.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.url=https://generativelanguage.googleapis.com/v1beta/models/

# ===== VNPay (để YOUR_ để dùng cổng thanh toán giả lập) =====
vnpay.tmn-code=${VNPAY_TMN_CODE:YOUR_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET:YOUR_HASH_SECRET}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/payment/vnpay-return

# ===== Đăng nhập Google (để trống thì tắt) =====
# Redirect URI cần khai báo ở Google Cloud Console: http://localhost:8080/login/oauth2/code/google
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
