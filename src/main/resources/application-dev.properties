# Profile "dev": chạy bằng H2 trong RAM để làm giao diện, không cần MySQL.
# Dữ liệu mất khi tắt ứng dụng; DataInitializer sẽ tạo lại dữ liệu mẫu mỗi lần chạy.
spring.datasource.url=jdbc:h2:mem:staygo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false
